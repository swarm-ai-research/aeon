{
  search(query: "author:aeonframework is:pr sort:updated-desc", type: ISSUE, first: 60) {
    nodes {
      ... on PullRequest {
        number
        title
        state
        headRefName
        url
        createdAt
        updatedAt
        mergedAt
        closedAt
        repository { nameWithOwner isArchived }
        reviews(last: 1) { nodes { state submittedAt } }
        comments(last: 3) { totalCount nodes { author { login } createdAt bodyText } }
        commits(last: 1) { nodes { commit { author { email name } } } }
      }
    }
  }
}
