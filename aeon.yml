# Aeon configuration
#
# Enable skills by setting enabled: true. Multiple skills at the same time run in parallel.
# Set var: "value" to pass a default parameter to the skill.
# Multi-line `var: |` blocks are also supported for skills that accept richer operator policy.
# Set model: "claude-sonnet-4-6" per skill to override the default model (cost optimization).

skills:
  # --- Planning (6:30 AM UTC — runs before the day's work; decides priorities) ---
  planner: { enabled: true, schedule: "30 6 * * *" } # reads goals + fleet health + recent activity, writes a ranked plan, notifies. Pass var=dispatch to also fire today's top skills; also wakes reactively on fleet degradation (see reactive: below)

  # --- Early-morning meta (reliability + memory hygiene + cleanup) ---
  batch-health: { enabled: true, schedule: "0 8 * * *", var: "" } # daily 08:00 UTC — audits whether the morning batch (06:00–07:30) actually fired; WARN on 1–2 misses, OUTAGE on 3+ (delivery watchdog, complements skill-health's quality checks)
  memory-flush: { enabled: true, schedule: "0 6 2/2 * *" } # every other day 06:00 UTC — promote important recent log entries into MEMORY.md
  memory-structural-dedupe: { enabled: true, schedule: "10 6 2/2 * *" } # every other day 06:10 UTC — collapse duplicate rows in MEMORY.md after memory-flush runs
  janitor: { enabled: true, schedule: "30 5 * * 0" } # Sunday 05:30 UTC — weekly cleanup of temp files (.notify-*, .pending-notify-temp/, stale .outputs/ artifacts past TTL)

  # --- Morning aggregation (7 AM UTC) ---
  morning-brief: { enabled: false, schedule: "0 7 * * *" }
  daily-routine: { enabled: false, schedule: "0 7 * * *" }
  rss-digest: { enabled: false, schedule: "0 7 * * *" }
  hacker-news-digest: { enabled: false, schedule: "0 7 * * *" }
  paper-digest: { enabled: false, schedule: "0 7 * * *" }

  reddit-digest: { enabled: false, schedule: "0 7 * * *" }
  telegram-digest: { enabled: false, schedule: "30 7 * * *", model: "claude-sonnet-4-6" }

  # --- Mid-morning (9 AM UTC) ---
  issue-triage: { enabled: true, schedule: "0 9 * * *" }
  pr-triage: { enabled: true, schedule: "30 9 * * *", var: "swarm-ai-safety/swarm" }
  pr-review:
    enabled: true
    schedule: "0 9,18 * * *"  # reduced from every 6h to 2×/day to cut Actions burn — still covers morning + evening review cycles
    var: |
      swarm-ai-safety/swarm

      You are acting as a merge gate reviewer.
      Your job is to decide: APPROVE, REQUEST_CHANGES, or BLOCK.

      Decision policy:
      - BLOCK if any critical security/correctness risk is present.
      - REQUEST_CHANGES if important test coverage, type-check coverage, or reliability/quality safeguards are missing.
      - APPROVE only if risk is low and evidence is sufficient.
  pr-tracker: { enabled: true, schedule: "0 10 * * *" } # daily 10:00 UTC — track status of cross-repo PRs this aeon opened (merges / stale-open / closures); automates the [[external-prs]] queue bookkeeping
  auto-merge: { enabled: false, schedule: "0 14 * * *" }
  github-monitor: { enabled: true, schedule: "0 9 * * *" }
  github-issues: { enabled: false, schedule: "0 9 * * *" }
  github-trending: { enabled: false, schedule: "0 9 * * *" }
  github-releases: { enabled: false, schedule: "30 9 * * *" }
  huggingface-trending:
    {
      enabled: false,
      schedule: "30 9 * * *",
      model: "claude-sonnet-4-6",
      var: ""
    }

  # --- Midday (12 PM UTC) ---
  token-alert: { enabled: false, schedule: "0 12 * * *" }
  token-movers: { enabled: false, schedule: "0 12 * * *" }
  on-chain-monitor: { enabled: false, schedule: "0 12 * * *" }
  defi-monitor: { enabled: false, schedule: "0 12 * * *" }
  treasury-info: { enabled: false, schedule: "0 12 * * *" }
  distribute-tokens: { enabled: false, schedule: "workflow_dispatch", var: "" }
  defi-overview: { enabled: false, schedule: "0 12 * * *" }

  monitor-polymarket: { enabled: false, schedule: "30 12 * * *", model: "claude-sonnet-4-6" }
  monitor-kalshi: { enabled: false, schedule: "0 13 * * *", model: "claude-sonnet-4-6" }
  monitor-runners: { enabled: false, schedule: "0 12 * * *" }
  token-pick: { enabled: false, schedule: "0 12 * * *" }
  token-report: { enabled: false, schedule: "30 12 * * *", model: "claude-sonnet-4-6" }
  price-threshold-alert:
    {
      enabled: false,
      schedule: "*/30 * * * *",
      model: "claude-sonnet-4-6",
      var: ""
    }
  market-context-refresh: { enabled: false, schedule: "0 13 * * *", model: "claude-sonnet-4-6" }
  narrative-tracker: { enabled: false, schedule: "30 13 * * *" }
  polymarket-comments: { enabled: false, schedule: "0 13 * * *" }
  unlock-monitor: { enabled: false, schedule: "0 10 * * 1" }
  aixbt-pulse: { enabled: false, schedule: "0 9,21 * * *", model: "claude-sonnet-4-6" }

  # --- Afternoon (2 PM UTC) ---
  content-engine:
    {
      enabled: false,  # disabled in skill audit — daily article generation not consumed regularly; re-enable if you start using the output
      schedule: "0 14 * * *",
      model: "claude-sonnet-4-6",
      var: "AI agents, coding tools, automation, developer infrastructure, open-source
        devtools"
    }
  topic-momentum: { enabled: false, schedule: "0 13 * * 0", model: "claude-sonnet-4-6" } # disabled in skill audit — pairs with content-engine; re-enable together if you bring article generation back
  article: { enabled: false, schedule: "0 14 * * *" }
  technical-explainer: { enabled: false, schedule: "30 14 * * *" }
  digest: { enabled: false, schedule: "0 14 * * *" }
  research-brief: { enabled: false, schedule: "0 14 * * *" }
  deep-research: { enabled: false, schedule: "workflow_dispatch", var: "" }
  last30: { enabled: false, schedule: "workflow_dispatch", var: "" }
  paper-pick: { enabled: false, schedule: "0 14 * * *" }
  search-skill: { enabled: false, schedule: "0 14 * * *" }

  security-digest: { enabled: false, schedule: "0 14 * * *" }
  idea-capture: { enabled: false, schedule: "0 14 * * *" }
  deal-flow: { enabled: false, schedule: "0 14 * * 1" }
  reg-monitor: { enabled: false, schedule: "0 14 * * 3" }

  # --- Repo intelligence (3 PM UTC) ---
  push-recap: { enabled: false, schedule: "0 15 * * *" }
  repo-article: { enabled: false, schedule: "0 15 * * *" }
  repo-actions: { enabled: false, schedule: "0 15 * * *" }
  repo-pulse: { enabled: false, schedule: "0 15 * * *" }
  star-milestone: { enabled: false, schedule: "15 15 * * *" }
  star-momentum-alert:
    {
      enabled: false,
      schedule: "10 10 * * *",
      model: "claude-sonnet-4-6",
      var: ""
    }
  project-lens: { enabled: false, schedule: "30 15 * * 1,3,5" }
  repo-scanner:
    {
      enabled: false,
      schedule: "0 15 * * 0",
      model: "claude-sonnet-4-6",
      var: ""
    }
  repo-revive: { enabled: true, schedule: "0 10 * * 6" } # Sat 10:00 UTC — pick the highest-★ dormant watched repo and open one targeted reactivation PR (stale model refs, README, metadata)

  # --- Late afternoon (4 PM UTC) ---
  skill-security-scan: { enabled: false, schedule: "0 16 * * 1" }
  code-health: { enabled: true, schedule: "0 16 * * *" }
  surplus-pulse: { enabled: true, schedule: "30 16 * * *", model: "claude-sonnet-4-6" }
  compute-pulse: { enabled: true, schedule: "0 11 * * 6", model: "claude-sonnet-4-6" } # Saturday 11:00 UTC — weekly AI-compute-market read (GPU/hardware deals, inference pricing, DePIN signals, lab vs hyperscaler); feeds memory/topics/compute-pulse.md + the compute-futures prototype goal
  compute-macro-correlate: { enabled: true, schedule: "30 6 * * 0", model: "claude-sonnet-4-6" } # Sunday 06:30 UTC — weekly partial-correlation of compute economics vs Hyperliquid macro basket. Migrated from rsavitt/aeon 2026-06-07 — runs here on the public mirror for free Actions minutes.
  compute-futures-eda: { enabled: true, schedule: "0 6 * * *" } # daily 06:00 UTC — profile latest deployer sweep CSV from memory/gitlawb-compute-futures-proofs/, commit findings to memory/topics/compute-futures-eda/; deployer runs ~00:13 UTC so 6h is comfortable rsync margin
  changelog: { enabled: true, schedule: "0 16 * * 1" } # Mon 16:00 UTC — weekly user-facing changelog (Keep a Changelog) from watched-repo commits
  external-feature: { enabled: false, schedule: "30 16 * * *", var: "" }
  # --- Security / PVR disclosure subsystem (vuln-scanner is the producer; the rest are self-gating status trackers, silent until pending-disclosures exist) ---
  vuln-scanner: { enabled: true, schedule: "0 16 * * 6", var: "" } # Sat 16:00 UTC — audit trending repos for real vulns, disclose via PVR / dependency PRs
  # PVR / disclosure subsystem — disabled in skill audit (2026-05-30). All four
  # produced zero log entries over a 10-day window: they're self-gating trackers
  # that go silent when the pending-disclosure queue is empty, which it has been.
  # Re-enable as a group once vuln-scanner produces a disclosure that needs tracking.
  vuln-tracker: { enabled: false, schedule: "0 11 * * *" } # daily 11:00 UTC — status check on every PR/advisory/draft vuln-scanner produced
  disclosure-tracker: { enabled: false, schedule: "30 11 * * *" } # daily 11:30 UTC — audit pending-disclosure queue, alert on aging CRITICAL/HIGH
  pvr-watchlist: { enabled: false, schedule: "0 9 * * 1" } # Mon 09:00 UTC — weekly probe of watchlist repos for private-vuln-reporting status flips + queued re-submits
  pvr-triage-monitor: { enabled: false, schedule: "30 9 * * 1" } # Mon 09:30 UTC — weekly PVR lifecycle check; flags reports aging past 30d with no response
  deploy-prototype: { enabled: false, schedule: "workflow_dispatch", var: "" }
  autoresearch: { enabled: false, schedule: "workflow_dispatch", var: "" }
  create-skill: { enabled: false, schedule: "workflow_dispatch", var: "" }

  # --- X / social (5 PM UTC) ---
  fetch-tweets: { enabled: false, schedule: "0 17 * * *" }
  refresh-x: { enabled: false, schedule: "0 17 * * *" }
  list-digest: { enabled: false, schedule: "0 17 * * *" }
  write-tweet: { enabled: false, schedule: "0 17 * * *" }
  reply-maker: { enabled: false, schedule: "0 17 * * *" }
  remix-tweets: { enabled: false, schedule: "30 17 * * *" }
  tweet-roundup: { enabled: false, schedule: "0 17 * * *", var: "" }
  agent-buzz: { enabled: false, schedule: "30 17 * * *" }
  farcaster-digest: { enabled: false, schedule: "0 17 * * *" }
  vibecoding-digest: { enabled: false, schedule: "30 17 * * *" }
  channel-recap: { enabled: false, schedule: "0 17 * * 0", var: "" }

  # --- Feed generation (5:30 PM UTC, after content skills) ---
  rss-feed: { enabled: false, schedule: "30 17 * * *" } # disabled in skill audit — pairs with content-engine; re-enable when article generation is back
  thread-formatter: { enabled: false, schedule: "30 17 * * *", var: "" }

  # --- Gallery update (Sunday 6 PM UTC, after content week) ---
  update-gallery: { enabled: false, schedule: "0 18 * * 0" }

  # --- Content distribution (runs 30 min after article-generating skills) ---
  syndicate-article:
    {
      enabled: false,
      schedule: "30 15 * * *",
      model: "claude-sonnet-4-6",
      var: ""
    }

  # --- Evening / meta (6 PM UTC) ---
  goal-tracker: { enabled: true, schedule: "0 18 * * *" }
  milestone-tracker: { enabled: true, schedule: "0 12 * * 1" } # Mon 12:00 UTC — weekly product/growth milestone tracking; needs memory/milestones.md to be useful (thin until defined)
  skill-health: { enabled: true, schedule: "0 18 * * *" }
  config-validator: { enabled: true, schedule: "0 7 * * 0" } # Sunday 07:00 UTC — weekly safety net: duplicate keys, checkout ordering, missing skill files in aeon.yml
  skill-analytics: { enabled: true, schedule: "30 18 * * 3", model: "claude-sonnet-4-6" } # Wed 18:30 UTC — weekly fleet skill-run analytics (run counts, success rates, anomalies); feeds planner/goal-tracker

  self-improve: { enabled: false, schedule: "0 18 1/2 * *" }
  reflect: { enabled: true, schedule: "0 18 * * *" }
  self-review: { enabled: true, schedule: "30 18 * * 0" } # Sunday 18:30 UTC — weekly audit of what the agent did, what failed, and what to improve (complements daily reflect + biweekly self-improve)

  action-converter: { enabled: false, schedule: "0 18 * * *" }
  startup-idea: { enabled: false, schedule: "0 18 * * *" }
  tool-builder: { enabled: false, schedule: "reactive", var: "" }
  skill-repair: { enabled: true, schedule: "reactive", var: "" }
  evening-recap: { enabled: false, schedule: "0 21 * * *", model: "claude-sonnet-4-6" }
  vercel-projects:
    {
      enabled: false,
      schedule: "0 18 * * 0",
      model: "claude-sonnet-4-6",
      var: ""
    }

  # --- Cost tracking (Monday 7 AM UTC, weekly) ---
  cost-report: { enabled: true, schedule: "0 7 * * 1", model: "claude-sonnet-4-6" } # Mon 07:00 UTC — weekly API cost report from memory/token-usage.csv (provider: direct); flags anomalies + forecasts burn

  # --- Weekly (Monday only) ---
  ai-framework-watch:
    {
      enabled: true,
      schedule: "30 8 * * 1",
      model: "claude-sonnet-4-6",
      var: ""
    } # Monday 08:30 UTC — weekly competitive-intelligence digest across 9 AI agent frameworks (anchor + 8 peers). Momentum signals, 7d/30d star deltas, release listings, breaking-change flags. Set var to a watchlist slug (e.g. langgraph) for a single-framework deep dive.
  competitor-launch-radar:
    {
      enabled: false,
      schedule: "0 10 * * 1",
      model: "claude-sonnet-4-6",
      var: ""
    } # Monday 10:00 UTC — weekly scan of Product Hunt RSS + HN Algolia for NEW AI-agent-framework launches outside the 9-framework cohort tracked by ai-framework-watch. Classifies framework/mcp/product, LRU-200 dedup, gated notify (QUIET on zero entrants). Pass dry-run to skip notify.
  ecosystem-pulse:
    {
      enabled: false,
      schedule: "0 11 * * 1",
      model: "claude-sonnet-4-6",
      var: ""
    } # Monday 11:00 UTC — weekly liveness check of ECOSYSTEM.md projects: resolves each to a GitHub repo (operator map + strict search), reports stars/forks/last-push buckets (ACTIVE/RECENT/COLD/X-only) + releases in 7d window, WoW transitions. Read-only against ECOSYSTEM.md. Gated notify (QUIET when no releases/transitions/entrants). Pass dry-run to skip notify.
  fleet-state:
    {
      enabled: false,
      schedule: "0 8 * * 1",
      model: "claude-sonnet-4-6",
      var: ""
    } # Monday 08:00 UTC — weekly synthesis of fork-cohort + fork-release-tracker + contributor-spotlight into one fleet-state digest with WoW deltas + 12-week trend. Quiet weeks suppress notify. Pass dry-run to skip notify, or owner/repo to override parent.
  fork-fleet: { enabled: false, schedule: "0 10 * * 1" } # fork fleet scan — inventory active forks, detect diverged work
  fork-cohort: { enabled: false, schedule: "0 19 * * 0", model: "claude-sonnet-4-6" } # Sunday 19:00 UTC — bucket every fork by activation stage (COLD/STALE/ACTIVE/POWER) using GitHub Actions run history; week-over-week deltas; gated notify
  fork-release-tracker:
    {
      enabled: false,
      schedule: "30 19 * * 0",
      model: "claude-sonnet-4-6",
      var: ""
    } # Sunday 19:30 UTC — weekly scan: celebrate when any fork cuts a tagged GitHub release in the last 7 days. Silent on quiet weeks. Pass dry-run to skip notify, or owner/repo to override parent.
  contributor-spotlight:
    {
      enabled: false,
      schedule: "0 20 * * 0",
      model: "claude-sonnet-4-6",
      var: ""
    } # Sunday 20:00 UTC — weekly recognition post: pick one POWER fork from the latest fork-cohort run and convert it into a named human moment (operator handle, enabled stack, diverged work, 30d commits). 4-week dedup. Pass dry-run to skip notify, or owner/repo to override the auto-pick.
  fork-first-run-alert:
    {
      enabled: false,
      schedule: "30 20 * * *",
      model: "claude-sonnet-4-6",
      var: ""
    } # daily 20:30 UTC — named same-day alert the first time a fork completes a workflow run. Reads fork-cohort cache when fresh (≤8d), live-fallback otherwise. Persistent seen-list (LRU 500), bot allowlist suppressed from alerts. Per-fork alert when 1–3 new activators; batch notification at 4+ to avoid spam. Pass dry-run to skip notify, or owner/repo to override parent.
  skill-evals: { enabled: true, schedule: "0 9 * * 0", model: "claude-sonnet-4-6" } # Sunday 9 AM UTC — output quality assertions across all tracked skills; runs after heartbeat (08:00 daily) so today's memory/logs entry already has the heartbeat keyword — see ISS-006
  swarm-safety-eval: { enabled: true, schedule: "30 7 * * 0", model: "claude-sonnet-4-6" } # Sunday 07:30 UTC — grade the agent-first fleet's multi-agent safety dynamics with SWARM soft-metrics (toxicity/quality-gap/welfare), diff vs prior, notify on regression. Silent SSE_EMPTY until agentctl writes memory/agent-first ledgers
  skill-update-check: { enabled: true, schedule: "0 19 * * 0", model: "claude-sonnet-4-6" } # Sunday 7 PM UTC — check imported skills for upstream changes and security regressions
  spawn-instance: { enabled: false, schedule: "workflow_dispatch", var: "" } # on-demand — var: "name: purpose"
  fleet-control: { enabled: true, schedule: "0 9 * * *" } # reduced from 2×/day (09,15) to 1×/day (09) to cut Actions burn — fleet health changes slowly enough that morning check suffices
  fleet-runner: { enabled: false, schedule: "*/5 * * * *" } # MUST stay enabled:false — there is no skills/fleet-runner/SKILL.md; this entry is documentation only. The goal-loop fleet runs from .github/workflows/fleet-runner.yml's OWN */5 cron, gated solely by the GITLAWB_* secrets (NOT this flag). Activation/arming/disarming: see docs/fleet-runner.md.
  gitlawb-fleet: { enabled: false, schedule: "workflow_dispatch", var: "" } # fork-only
  gitlawb-fleet-metrics: { enabled: true, schedule: "0 8 * * *" } # fork-only
  weekly-review: { enabled: false, schedule: "0 19 * * 1" }
  weekly-shiplog: { enabled: true, schedule: "0 9 * * 1" } # Monday — narrative of everything shipped last week
  skill-leaderboard: { enabled: false, schedule: "0 17 * * 0", model: "claude-sonnet-4-6" } # Sunday — rank popular skills across forks
  fork-contributor-leaderboard: { enabled: false, schedule: "30 17 * * 0", model: "claude-sonnet-4-6" } # Sunday — rank community contributors across forks and upstream PRs
  contributor-reward:
    {
      enabled: false,
      schedule: "30 9 * * 1",
      model: "claude-sonnet-4-6",
      var: ""
    } # Monday — turn Sunday's leaderboard into a tier-priced rewards plan in memory/distributions.yml; pass dry-run to preview
  operator-scorecard:
    {
      enabled: false,
      schedule: "30 10 * * 1",
      model: "claude-sonnet-4-6",
      var: ""
    } # Monday — weekly plain-language scorecard: agent health + community growth + economic activity (worst-of-three OK/WATCH/DEGRADED verdict)
  fork-skill-digest: { enabled: false, schedule: "30 18 * * 0", model: "claude-sonnet-4-6" } # Sunday — divergence digest: where the configured fleet disagrees with upstream defaults
  fork-skill-gap:
    {
      enabled: false,
      schedule: "0 21 * * 0",
      model: "claude-sonnet-4-6",
      var: ""
    } # Sunday 21:00 UTC — per-fork table of upstream skills the fork hasn't adopted; gates on fork-cohort POWER+ACTIVE set when fresh, falls back to live API otherwise. Pass dry-run to skip notify, or owner/repo to override parent.
  workflow-security-audit: { enabled: true, schedule: "0 16 * * 0" } # fork override (enabled): Sunday — scan workflows for injection vectors
  skill-graph: { enabled: true, schedule: "0 17 * * 0" } # Sunday 17:00 UTC — regenerate Mermaid skill dependency map with enabled overlay
  notegraph: { enabled: true, schedule: "0 5 * * *" } # daily 05:00 UTC — regenerate notegraph.json + docs/notegraph.{md,html} from memory/+docs/; silent on no-change; PR + notify on graph deltas (new orphans always notify)
  skillpacks: { enabled: true, schedule: "0 6 * * 0" } # Sunday 06:00 UTC — cluster skills/ into 10-20 packs; silent on no-change; PR + notify on membership shifts (new/dropped packs always notify)
  suggest-edges: { enabled: true, schedule: "30 5 * * *" } # daily 05:30 UTC — find high-similarity unlinked note pairs, propose [[wikilinks]] via PR (capped 3/day, threshold 0.40); silent when none
  skill-freshness: { enabled: true, schedule: "0 8 * * *", model: "claude-sonnet-4-6", var: "" } # daily 08:00 UTC — audit enabled skills' upstream file dependencies for staleness; pass dry-run to skip notify; per-class thresholds (articles 28h / .outputs 4h / topics 7d / state 30d); fingerprint-based dedup, 7d re-emit window
  run-frequency-guard:
    {
      enabled: true,
      schedule: "0 23 * * *",
      model: "claude-sonnet-4-6",
      var: ""
    } # daily 23:00 UTC — per-skill run-count watchdog; alerts when a capped skill exceeds its daily run limit
  smithery-manifest: { enabled: false, schedule: "0 6 1/7 * *", model: "claude-sonnet-4-6" } # weekly — refresh docs/smithery-manifest.json + smithery.yaml + smithery-submission.md from skills.json + aeon-mcp; PR + notify only on diff
  show-hn-draft: { enabled: false, schedule: "workflow_dispatch", var: "" } # one-shot — draft Show HN post + r/MachineLearning + r/selfhosted variants from live repo state, ready for the operator to paste at launch time. Set var to one of {show-hn, r/MachineLearning, r/selfhosted} to regenerate that single variant.
  product-hunt-launch: { enabled: false, schedule: "workflow_dispatch", var: "" } # one-shot — draft the full Product Hunt launch asset pack (tagline 60ch / description 260ch / first comment 500ch / maker comment 500ch / six 80ch feature bullets) from live repo state. Set var to one of {tagline, description, first-comment, maker-comment, bullets} to regenerate that single section only.
  v4-readiness:
    {
      enabled: false,
      schedule: "workflow_dispatch",
      model: "claude-sonnet-4-6",
      var: ""
    } # one-shot — per-fork v4 upgrade readiness checklist. Reads aeon.yml + skills.json + MEMORY.md against an embedded v4 change manifest; emits Safe / Review / Custom / Action breakdown. Pass dry-run to skip notify, or owner/repo to audit a fork remotely.

  # --- Paid ads (AdManage.ai) ---
  schedule-ads:
    {
      enabled: false,
      schedule: "0 8 * * *",
      model: "claude-sonnet-4-6",
      var: ""
    }
  create-campaign: { enabled: false, schedule: "workflow_dispatch", var: "" }

  # --- Utilities ---
  auto-workflow: { enabled: false, schedule: "workflow_dispatch", var: "" }
  onboard: { enabled: false, schedule: "workflow_dispatch", var: "" }

  # --- Fallback (must be last) ---
  heartbeat: { enabled: true, schedule: "0 8 * * *" }  # reduced from 3×/day (08,14,20) to 1×/day (08) to cut Actions burn — single morning heartbeat covers daily health-check needs

reactive:
  skill-repair:
    trigger:
      - { on: "*", when: "consecutive_failures >= 3" }
  # planner wakes one rung earlier than skill-repair: when any skill starts
  # degrading (2 consecutive failures), re-plan the day with that front-and-
  # center. Runs plan-only (no dispatch) — skill-repair owns the actual fix.
  planner:
    trigger:
      - { on: "*", when: "consecutive_failures >= 2" }

chains:
  # daily-routine:
  #   schedule: "0 7 * * *"
  #   on_error: fail-fast
  #   steps:
  #     - parallel: [token-movers, paper-pick, github-issues, hacker-news-digest]
  #     - skill: daily-routine, consume: [token-movers, paper-pick, github-issues, hacker-news-digest]

model: claude-opus-4-7

gateway:
  provider: direct

channels:
  jsonrender:
    enabled: true

telegram:
  enabled: true
